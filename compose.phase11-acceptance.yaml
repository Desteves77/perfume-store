services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PHASE11_POSTGRES_PORT:-56500}:5432"
    volumes:
      - perfumestore-phase11-notification-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${PHASE11_SMTP_PORT:-11325}:1025"
      - "127.0.0.1:${PHASE11_MAILPIT_PORT:-18525}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  perfumestore-phase11-notification-postgres-data:
