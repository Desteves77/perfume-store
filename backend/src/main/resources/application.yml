spring:
  application:
    name: perfumestore-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: perfumestore
    default-schema: perfumestore
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
      cleanup-cron: "0 * * * * *"
  jackson:
    time-zone: UTC

  datasource:
    hikari:
      schema: perfumestore

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  catalog:
    images:
      storage-root: ${CATALOG_IMAGE_STORAGE_ROOT:./data/catalog-images}
      max-bytes: ${CATALOG_IMAGE_MAX_BYTES:5242880}
      max-images-per-product: ${CATALOG_IMAGE_MAX_IMAGES:8}
      max-pixels: ${CATALOG_IMAGE_MAX_PIXELS:20000000}
  order:
    payment-ttl: ${ORDER_PAYMENT_TTL:15m}
    expiration-interval: ${ORDER_EXPIRATION_INTERVAL:1m}
    expiration-batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
    expiration-enabled: ${ORDER_EXPIRATION_ENABLED:true}
  payment:
    enabled: ${PAYMENT_ENABLED:false}
    provider: ${PAYMENT_PROVIDER:}
    checkout-ttl: ${PAYMENT_CHECKOUT_TTL:15m}
    webhook-tolerance: ${PAYMENT_WEBHOOK_TOLERANCE:5m}
    mock-webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:}
    mock-checkout-base-url: ${PAYMENT_MOCK_CHECKOUT_BASE_URL:mock://checkout}
    reconciliation-batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
    reconciliation-enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
  security:
    session-cookie:
      secure: ${SESSION_COOKIE_SECURE:false}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    rate-limit:
      login-max-attempts: ${LOGIN_RATE_LIMIT_MAX:5}
      login-window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
      recovery-max-attempts: ${RECOVERY_RATE_LIMIT_MAX:5}
      recovery-window: ${RECOVERY_RATE_LIMIT_WINDOW:15m}
      reset-max-attempts: ${RESET_RATE_LIMIT_MAX:5}
      reset-window: ${RESET_RATE_LIMIT_WINDOW:15m}
      register-max-attempts: ${REGISTER_RATE_LIMIT_MAX:10}
      register-window: ${REGISTER_RATE_LIMIT_WINDOW:10m}
  password-recovery:
    frontend-base-url: ${FRONTEND_PASSWORD_RESET_URL}
    sender-address: ${MAIL_FROM:no-reply@perfumestore.local}
  admin:
    provisioning:
      enabled: ${ADMIN_PROVISIONING_ENABLED:false}
      name: ${ADMIN_PROVISIONING_NAME:}
      email: ${ADMIN_PROVISIONING_EMAIL:}
      password: ${ADMIN_PROVISIONING_PASSWORD:}
