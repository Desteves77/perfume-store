spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

app:
  catalog:
    images:
      storage-root: ${CATALOG_IMAGE_STORAGE_ROOT:./data/catalog-images}
      max-bytes: ${CATALOG_IMAGE_MAX_BYTES:5242880}
      max-images-per-product: ${CATALOG_IMAGE_MAX_IMAGES:8}
      max-pixels: ${CATALOG_IMAGE_MAX_PIXELS:20000000}
  shipping:
    enabled: ${SHIPPING_ENABLED:false}
    method: ${SHIPPING_METHOD:INITIAL_RULE_LOCAL}
    rule-version: ${SHIPPING_RULE_VERSION:local-synthetic-v1}
    amount: ${SHIPPING_AMOUNT:15.90}
    min-days: ${SHIPPING_MIN_DAYS:3}
    max-days: ${SHIPPING_MAX_DAYS:6}
    quote-ttl: ${SHIPPING_QUOTE_TTL:30m}
    synthetic: ${SHIPPING_SYNTHETIC:true}
    served-ranges: ${SHIPPING_SERVED_RANGES:01000000-09999999}
  cart:
    visitor-ttl: ${CART_VISITOR_TTL:30d}
    customer-ttl: ${CART_CUSTOMER_TTL:90d}
    cleanup-retention: ${CART_CLEANUP_RETENTION:7d}
    cleanup-interval: ${CART_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${CART_CLEANUP_BATCH_SIZE:100}
    max-items: ${CART_MAX_ITEMS:50}
    max-quantity-per-item: ${CART_MAX_QUANTITY_PER_ITEM:20}
    cleanup-enabled: ${CART_CLEANUP_ENABLED:true}
    cookie:
      name: ${CART_COOKIE_NAME:CART_TOKEN}
      path: ${CART_COOKIE_PATH:/api/v1}
      secure: ${CART_COOKIE_SECURE:false}
      same-site: ${CART_COOKIE_SAME_SITE:Lax}
      max-age: ${CART_COOKIE_MAX_AGE:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  security:
    csrf:
      cookie-secure: ${CSRF_COOKIE_SECURE:false}
      cookie-same-site: ${CSRF_COOKIE_SAME_SITE:Lax}
  password-recovery:
    frontend-base-url: ${FRONTEND_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
