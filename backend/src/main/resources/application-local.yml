spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

app:
  catalog:
    images:
      storage-root: ${CATALOG_IMAGE_STORAGE_ROOT:./data/catalog-images}
      max-bytes: ${CATALOG_IMAGE_MAX_BYTES:5242880}
      max-images-per-product: ${CATALOG_IMAGE_MAX_IMAGES:8}
      max-pixels: ${CATALOG_IMAGE_MAX_PIXELS:20000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  security:
    csrf:
      cookie-secure: ${CSRF_COOKIE_SECURE:false}
      cookie-same-site: ${CSRF_COOKIE_SAME_SITE:Lax}
  password-recovery:
    frontend-base-url: ${FRONTEND_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
