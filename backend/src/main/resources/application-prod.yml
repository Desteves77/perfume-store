spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    clean-disabled: true

server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  catalog:
    images:
      storage-root: ${CATALOG_IMAGE_STORAGE_ROOT}
      max-bytes: ${CATALOG_IMAGE_MAX_BYTES:5242880}
      max-images-per-product: ${CATALOG_IMAGE_MAX_IMAGES:8}
      max-pixels: ${CATALOG_IMAGE_MAX_PIXELS:20000000}
  shipping:
    enabled: ${SHIPPING_ENABLED:false}
    method: ${SHIPPING_METHOD:}
    rule-version: ${SHIPPING_RULE_VERSION:}
    amount: ${SHIPPING_AMOUNT:}
    min-days: ${SHIPPING_MIN_DAYS:0}
    max-days: ${SHIPPING_MAX_DAYS:0}
    quote-ttl: ${SHIPPING_QUOTE_TTL:30m}
    synthetic: false
    served-ranges: ${SHIPPING_SERVED_RANGES:}
  cart:
    visitor-ttl: ${CART_VISITOR_TTL:30d}
    customer-ttl: ${CART_CUSTOMER_TTL:90d}
    cleanup-retention: ${CART_CLEANUP_RETENTION:7d}
    cleanup-interval: ${CART_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${CART_CLEANUP_BATCH_SIZE:100}
    max-items: ${CART_MAX_ITEMS:50}
    max-quantity-per-item: ${CART_MAX_QUANTITY_PER_ITEM:20}
    cleanup-enabled: ${CART_CLEANUP_ENABLED:true}
    cookie:
      name: ${CART_COOKIE_NAME:CART_TOKEN}
      path: ${CART_COOKIE_PATH:/api/v1}
      secure: ${CART_COOKIE_SECURE:true}
      same-site: ${CART_COOKIE_SAME_SITE:Lax}
      max-age: ${CART_COOKIE_MAX_AGE:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  order:
    payment-ttl: ${ORDER_PAYMENT_TTL:}
    expiration-interval: ${ORDER_EXPIRATION_INTERVAL:1m}
    expiration-batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
    expiration-enabled: ${ORDER_EXPIRATION_ENABLED:true}
  security:
    session-cookie:
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    csrf:
      cookie-secure: ${CSRF_COOKIE_SECURE:true}
      cookie-same-site: ${CSRF_COOKIE_SAME_SITE:Lax}
  password-recovery:
    frontend-base-url: ${FRONTEND_PASSWORD_RESET_URL}
    sender-address: ${MAIL_FROM}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
