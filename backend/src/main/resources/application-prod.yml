spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    clean-disabled: true

server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  security:
    session-cookie:
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    csrf:
      cookie-secure: ${CSRF_COOKIE_SECURE:true}
      cookie-same-site: ${CSRF_COOKIE_SAME_SITE:Lax}
  password-recovery:
    frontend-base-url: ${FRONTEND_PASSWORD_RESET_URL}
    sender-address: ${MAIL_FROM}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
