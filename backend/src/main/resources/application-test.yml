spring:
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      maximum-pool-size: 4

server:
  port: 0
  servlet:
    session:
      cookie:
        secure: false
        same-site: Lax

app:
  catalog:
    images:
      storage-root: ${CATALOG_IMAGE_STORAGE_ROOT:./target/test-catalog-images}
      max-bytes: 5242880
      max-images-per-product: 8
      max-pixels: 20000000
  shipping:
    enabled: true
    method: INITIAL_RULE_TEST
    rule-version: test-synthetic-v1
    amount: 15.90
    min-days: 3
    max-days: 6
    quote-ttl: 30m
    synthetic: true
    served-ranges: 01000000-09999999
  cart:
    visitor-ttl: 30d
    customer-ttl: 90d
    cleanup-retention: 7d
    cleanup-interval: 1h
    cleanup-batch-size: 100
    max-items: 50
    max-quantity-per-item: 20
    cleanup-enabled: false
    cookie:
      name: CART_TOKEN
      path: /api/v1
      secure: false
      same-site: Lax
      max-age: 30d
  cors:
    allowed-origins: http://allowed.test
    allow-credentials: true
  order:
    payment-ttl: 15m
    expiration-interval: 1m
    expiration-batch-size: 100
    expiration-enabled: true
  payment:
    enabled: true
    provider: MOCK
    checkout-ttl: 15m
    webhook-tolerance: 5m
    mock-webhook-secret: test-only-mock-webhook-secret
    mock-checkout-base-url: mock://checkout
    reconciliation-batch-size: 100
    reconciliation-enabled: false
  security:
    csrf:
      cookie-secure: false
      cookie-same-site: Lax
  password-recovery:
    frontend-base-url: http://frontend.test/reset-password
