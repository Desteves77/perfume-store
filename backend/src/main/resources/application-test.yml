spring:
  flyway:
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 4

server:
  port: 0
  servlet:
    session:
      cookie:
        secure: false
        same-site: Lax

app:
  cors:
    allowed-origins: http://allowed.test
    allow-credentials: true
  security:
    csrf:
      cookie-secure: false
      cookie-same-site: Lax
  password-recovery:
    frontend-base-url: http://frontend.test/reset-password
